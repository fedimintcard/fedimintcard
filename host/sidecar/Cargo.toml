[package]
name = "fedimint-card-sidecar"
description = "Card wallet CLI: holds Fedimint mint v1 notes on a JavaCard's spend keys"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[features]
default = []
# PC/SC card reader backend (CARD_BACKEND=pcsc).
pcsc = ["fedimint-card-host-card/pcsc"]

[lib]
name = "fedimint_card_sidecar"
path = "src/lib.rs"

[[bin]]
name = "card-sidecar"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws"] }
clap = { version = "4", features = ["derive", "env"] }
fedimint-api-client = { workspace = true }
fedimint-bip39 = { workspace = true }
fedimint-card-host-card = { path = "../card" }
fedimint-card-pos-core = { path = "../pos-core" }
fedimint-client = { workspace = true }
fedimint-connectors = { workspace = true }
fedimint-core = { workspace = true }
fedimint-mint-client = { workspace = true }
fedimint-ln-client = { workspace = true }
fedimint-ln-common = { workspace = true }
fedimint-lnv2-client = { workspace = true }
fedimint-mint-common = { workspace = true }
fedimint-rocksdb = { workspace = true }
futures = "0.3"
lightning-invoice = "0.33.2"
hex = "0.4"
qrcode = { version = "0.14", default-features = false }
rand = "0.8"
# The ops registry (docs/OPS-PLAN.md § 6). Same features fedimint already resolves, so no new crates.
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tbs = { workspace = true }
tokio = { workspace = true, features = ["net", "signal", "sync"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }

[dev-dependencies]
# The lnv2 test gateway (tests/wallet_pay.rs) implements a fedimint trait declared with async-trait.
async-trait = "0.1"
fedimint-card-host-card = { path = "../card", features = ["softkit"] }
fedimint-dummy-client = { workspace = true }
fedimint-dummy-server = { workspace = true }
fedimint-mint-server = { workspace = true }
fedimint-ln-server = { workspace = true }
fedimint-lnv2-server = { workspace = true }
fedimint-testing = { workspace = true }
p256 = { version = "0.13", features = ["ecdsa"] }
tempfile = "3"
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
