[package]
name = "fedimint-card-fed-tests"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[dependencies]
fedimint-server-core = { git = "https://github.com/fedimint/fedimint", tag = "v0.13.0" }
async-trait = "0.1"
erased-serde = "0.4"
anyhow = { workspace = true }
fedimint-card-host-card = { path = "../card" }
fedimint-api-client = { workspace = true }
fedimint-client = { workspace = true }
fedimint-core = { workspace = true }
fedimint-dummy-client = { workspace = true }
fedimint-dummy-common = { workspace = true }
fedimint-dummy-server = { workspace = true }
fedimint-mintv2-client = { workspace = true }
fedimint-mintv2-common = { workspace = true }
fedimint-mintv2-server = { workspace = true }
fedimint-testing = { workspace = true }
tbs = { workspace = true }
tokio = { workspace = true, features = ["process"] }
tracing = { workspace = true }
serde_json = "1"

[dev-dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["json"] }
# The P1 00 PIN of cards older than 4.0, for tests only: never a [dependencies] entry.
fedimint-card-old-card-pin = { path = "../old-card-pin" }
fedimint-card-sidecar = { path = "../sidecar" }
fedimint-lnv2-client = { workspace = true }
fedimint-lnv2-server = { workspace = true }
fedimint-meta-client = { workspace = true }
fedimint-meta-server = { workspace = true }
fedimint-mint-client = { workspace = true }
fedimint-mint-server = { workspace = true }
fedimint-walletv2-client = { workspace = true }
fedimint-walletv2-server = { workspace = true }
tempfile = "3"
