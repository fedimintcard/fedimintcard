[workspace]
resolver = "2"
members = ["card", "fed-tests", "pos-core", "sidecar"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
version = "0.1.0"

[workspace.dependencies]
fedimint-core = { git = "https://github.com/fedimint/fedimint", tag = "v0.13.0-beta.1" }
fedimint-api-client = { git = "https://github.com/fedimint/fedimint", tag = "v0.13.0-beta.1" }
fedimint-client = { git = "https://github.com/fedimint/fedimint", tag = "v0.13.0-beta.1" }
fedimint-testing = { git = "https://github.com/fedimint/fedimint", tag = "v0.13.0-beta.1" }
fedimint-mintv2-common = { git = "https://github.com/fedimint/fedimint", tag = "v0.13.0-beta.1" }
fedimint-mintv2-client = { git = "https://github.com/fedimint/fedimint", tag = "v0.13.0-beta.1" }
fedimint-mintv2-server = { git = "https://github.com/fedimint/fedimint", tag = "v0.13.0-beta.1" }
fedimint-dummy-common = { git = "https://github.com/fedimint/fedimint", tag = "v0.13.0-beta.1" }
fedimint-dummy-client = { git = "https://github.com/fedimint/fedimint", tag = "v0.13.0-beta.1" }
fedimint-dummy-server = { git = "https://github.com/fedimint/fedimint", tag = "v0.13.0-beta.1" }
fedimint-mint-common = { git = "https://github.com/fedimint/fedimint", tag = "v0.13.0-beta.1" }
fedimint-mint-client = { git = "https://github.com/fedimint/fedimint", tag = "v0.13.0-beta.1" }
fedimint-ln-client = { git = "https://github.com/fedimint/fedimint", tag = "v0.13.0-beta.1" }
fedimint-ln-common = { git = "https://github.com/fedimint/fedimint", tag = "v0.13.0-beta.1" }
fedimint-ln-server = { git = "https://github.com/fedimint/fedimint", tag = "v0.13.0-beta.1" }
fedimint-lnv2-client = { git = "https://github.com/fedimint/fedimint", tag = "v0.13.0-beta.1" }
fedimint-lnv2-server = { git = "https://github.com/fedimint/fedimint", tag = "v0.13.0-beta.1" }
fedimint-mint-server = { git = "https://github.com/fedimint/fedimint", tag = "v0.13.0-beta.1" }
fedimint-bip39 = { git = "https://github.com/fedimint/fedimint", tag = "v0.13.0-beta.1" }
fedimint-connectors = { git = "https://github.com/fedimint/fedimint", tag = "v0.13.0-beta.1" }
fedimint-rocksdb = { git = "https://github.com/fedimint/fedimint", tag = "v0.13.0-beta.1" }
tbs = { package = "fedimint-tbs", git = "https://github.com/fedimint/fedimint", tag = "v0.13.0-beta.1" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
anyhow = "1"
tracing = "0.1"

# Fedimint's [profile.dev.package] overrides do not propagate to git dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package]
bitcoin_hashes = { opt-level = 3 }
bls12_381 = { opt-level = 3 }
fedimint-threshold-crypto = { opt-level = 3 }
ff = { opt-level = 3 }
group = { opt-level = 3 }
librocksdb-sys = { opt-level = 3 }
pairing = { opt-level = 3 }
rand_chacha = { opt-level = 3 }
ring = { opt-level = 3 }
rustls = { opt-level = 3 }
secp256k1 = { opt-level = 3 }
secp256k1-sys = { opt-level = 3 }
subtle = { opt-level = 3 }

# The planner searches a few million combinations; keep it fast in debug builds.
fedimint-card-pos-core = { opt-level = 2 }
fedimint-card-sidecar = { opt-level = 2 }

[profile.ci]
debug = "line-tables-only"
incremental = false
inherits = "dev"

[profile.ci.build-override]
debug = false
opt-level = 1

# The POS apps' library (scripts/pos-core-mobile.sh): small, and panics unwind so the core can
# catch one. Every `PosCore` method but `phone_id` returns a Result and answers a panic as
# `PosCoreError::Internal`, and `self_check` answers false; an export that does not throw would
# trap the app instead (Swift calls those with `try!`).
[profile.mobile]
codegen-units = 1
inherits = "release"
lto = true
opt-level = "z"
panic = "unwind"
strip = true
