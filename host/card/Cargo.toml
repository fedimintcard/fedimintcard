[package]
name = "fedimint-card-host-card"
description = "Transport and client for the Fedimint spend-key JavaCard applet"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[features]
default = []
# PC/SC backend (needs libpcsclite on Linux; the PC/SC framework ships with macOS).
pcsc = ["dep:pcsc"]

[dependencies]
anyhow = { workspace = true }
hex = "0.4"
pcsc = { version = "2", optional = true }
rand = "0.10"
secp256k1 = { version = "0.29", features = ["global-context", "rand-std"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json"] }
