name: Mobile
# The POS apps' Rust core (host/pos-core, docs/POS-OFFLINE.md) for Android and iOS, with its
# Kotlin and Swift bindings. Proves the cross-compile on every change under host/; the libraries,
# the bindings and their sizes are uploaded for the apps. The Android POS app (android-relay/)
# builds on them: its unit tests and a debug APK whose libraries are 16 KB aligned.
on:
  push:
    branches: ['**']
    paths: ['host/**', 'android-relay/**', 'ios-pos/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['host/**', 'android-relay/**', 'ios-pos/**', '.github/workflows/mobile.yml']
permissions: { contents: read }
# Block form, not a flow mapping: a `{ ... }` map containing `${{ }}` does not parse.
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake pkg-config libssl-dev protobuf-compiler build-essential
      - uses: dtolnay/rust-toolchain@1.91.1
        with: { targets: 'aarch64-linux-android,x86_64-linux-android' }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "host -> target"
          key: android
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo install cargo-ndk --locked --version 4.1.2
      # The core runs on a phone with no network: no fedimint client, API client or rocksdb.
      - name: the core's dependencies
        working-directory: host
        run: scripts/pos-core-mobile.sh check
      - name: arm64-v8a and x86_64, API 26, 16 KB pages
        working-directory: host
        # The runner's newest NDK (ANDROID_NDK_HOME there is an older default).
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" scripts/pos-core-mobile.sh android
      - name: Kotlin bindings
        working-directory: host
        run: scripts/pos-core-mobile.sh bindings kotlin
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '17' }
      - name: The Android app, unit tests and debug build (Gradle reruns the core steps from cache)
        working-directory: android-relay
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - run: cat host/target/pos-core-mobile/sizes.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: pos-core-android
          path: |
            host/target/pos-core-mobile/android
            host/target/pos-core-mobile/bindings/kotlin
            host/target/pos-core-mobile/sizes.txt
      # The POS app: Gradle reruns the two steps above through the same script (cargo finds them
      # built), so its bindings and libraries come from this tree.
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '17', cache: gradle }
      - name: the POS app (unit tests, debug APK)
        working-directory: android-relay
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: the APK's libraries, 16 KB aligned
        # Named, the shell runs with pipefail: a zipalign that fails fails the step.
        shell: bash
        run: |
          apk=android-relay/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$apk" | grep -E 'lib/(arm64-v8a|x86_64)/'
          zipalign="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/zipalign"
          "$zipalign" -c -P 16 -v 4 "$apk" | tail -n 1
  ios:
    # macos-14 runners are retired; the newest image has the Xcode the targets need.
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@1.91.1
        with: { targets: 'aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios' }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "host -> target"
          key: ios
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios
        working-directory: host
        run: scripts/pos-core-mobile.sh ios
      - name: Swift bindings
        working-directory: host
        run: scripts/pos-core-mobile.sh bindings swift
      - name: The iOS app, package and unit tests on a simulator
        shell: bash
        run: |
          ios-pos/scripts/build-poscore.sh
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; ds=[x for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")]; print(ds[0]["udid"] if ds else sys.exit("no iPhone simulator"))')
          echo "simulator: $udid $(xcrun simctl list devices available | grep -m1 "$udid" | sed -E 's/ *\(.*//')"
          xcodebuild test -project ios-pos/FedimintCardPOS.xcodeproj -scheme FedimintCardPOS \
            -destination "platform=iOS Simulator,id=$udid" -derivedDataPath /tmp/pos-dd \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/xcodebuild.log | grep -E 'Test Suite|Executed|error:|\*\* TEST'
      - run: cat host/target/pos-core-mobile/sizes.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: pos-core-ios
          path: |
            host/target/pos-core-mobile/ios
            host/target/pos-core-mobile/bindings/swift
            host/target/pos-core-mobile/sizes.txt
