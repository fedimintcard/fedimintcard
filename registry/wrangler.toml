# The hosted registry, which docs/OPS-PLAN.md calls ops (§ 5).
#
# One Worker, one SQLite-backed Durable Object. The object owns every row and
# every session, so there is exactly one writer and no cross-request race to
# reason about: two phones posting the same short_id converge on the same
# answer because they queue behind the same object.
name = "fedimintcard-registry"
main = "src/index.ts"
compatibility_date = "2025-10-01"
# Production answers only on registry.fedimintcard.org (a custom domain set in
# the dashboard); staging has no domain, so it keeps its workers.dev URL.
workers_dev = false
preview_urls = false

# Operators are created by a setup command, a secret, never over HTTP
# (src/auth.ts). It is applied once per nonce when the object starts:
#   npx wrangler secret put OPERATOR_SETUP
#   {"action":"bootstrap","nonce":"<16+ chars>","name":"<operator>","password":"<12+ chars>"}
# `recover` with a new nonce resets a named operator's password and revokes
# their sessions. For `wrangler dev`, put OPERATOR_SETUP in .dev.vars; it does
# not read the shell environment.

[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "Registry"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Registry"]

# Staging: the same Worker under its own name and Durable Object, on
# workers.dev, so a change is exercised there before registry.fedimintcard.org.
#   npx wrangler deploy --env staging
#   npx wrangler secret put OPERATOR_SETUP --env staging
# The nightly encrypted backup (src/backup.ts, OPS-PLAN § 8), run by the
# object's own alarm (the account's free cron triggers are all in use). The
# recipient is public; its identity is kept outside this Cloudflare account.
[vars]
BACKUP_RECIPIENT = "age1lh9eyz5nutavut9t5tvd2x0elf0ff37q95h2puyyj2yuwqvl65cs3zcn73"

[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "fedimintcard-registry-backups"

[env.staging]
name = "fedimintcard-registry-staging"
workers_dev = true

[[env.staging.durable_objects.bindings]]
name = "REGISTRY"
class_name = "Registry"

[env.staging.vars]
BACKUP_RECIPIENT = "age1lh9eyz5nutavut9t5tvd2x0elf0ff37q95h2puyyj2yuwqvl65cs3zcn73"

[[env.staging.r2_buckets]]
binding = "BACKUPS"
bucket_name = "fedimintcard-registry-backups-staging"
