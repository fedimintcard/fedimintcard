[package]
name = "fedimintcard"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Read Fedimint Card 4.x applet state over an ISO 7816 transport"
repository = "https://github.com/fedimintcard/fedimintcard"
homepage = "https://fedimintcard.org"
keywords = ["fedimint", "nfc", "smartcard"]
include = ["src/", "tests/", "examples/", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
secp256k1 = { version = "0.29", default-features = false, features = ["std"] }
pcsc = { version = "2", optional = true }

[dev-dependencies]
hex = "0.4"
serde_json = "1"

[[example]]
name = "pcsc"
required-features = ["pcsc"]
