name: fedimintcard
description: Read Fedimint Card 4.x over Android or iOS NFC, verify issuer certificates, and use a paired merchant till for card payments and top-ups.
version: 0.1.0
homepage: https://fedimintcard.org
repository: https://github.com/fedimintcard/fedimintcard
environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.47.0'
dependencies:
  flutter:
    sdk: flutter
  pointycastle: ^4.0.0
  flutter_nfc_kit: ^3.7.0
dev_dependencies:
  flutter_test:
    sdk: flutter
