name: FedimintCardPOS
options:
  bundleIdPrefix: org.fedimintcard
  deploymentTarget:
    iOS: "26.5"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: H7UAM79QQP
    CODE_SIGN_STYLE: Automatic
targets:
  FedimintCardPOS:
    type: application
    platform: iOS
    sources:
      - path: FedimintCardPOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.fedimintcard.pos
        PRODUCT_NAME: FedimintCardPOS
        INFOPLIST_FILE: FedimintCardPOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: FedimintCardPOS/FedimintCardPOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "3"
        GENERATE_INFOPLIST_FILE: NO
  FedimintCardPOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FedimintCardPOSTests
    dependencies:
      - target: FedimintCardPOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.fedimintcard.pos.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FedimintCardPOS.app/FedimintCardPOS"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  FedimintCardPOS:
    build:
      targets:
        FedimintCardPOS: all
        FedimintCardPOSTests: [test]
    test:
      targets:
        - FedimintCardPOSTests
